manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: main # Or specify a stable tag like v3.7.0
      import:
        # 1. This tells West to block all downstream modules from Zephyr by default
        name-blocklist:
          - "*"
        # 2. This explicitly allows ONLY the Espressif HAL module to be downloaded
        name-allowlist:
          - hal_espressif
          - lvgl

  self:
    path: my_esp32_app
